name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: flagquantum-mcp-server
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default wheel on Linux x86_64 is the multi-GB
          # CUDA build and nothing here or in FlagQuantum needs it.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: ruff check
        working-directory: flagquantum-mcp-server
        run: ruff check .

      - name: ruff format --check
        working-directory: flagquantum-mcp-server
        run: ruff format --check .

      - name: mypy
        working-directory: flagquantum-mcp-server
        run: mypy --config-file ../mypy.ini src

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # FlagQuantum supports 3.10-3.12; 3.13 is excluded by its own
        # requires-python, so it is not tested here either.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        working-directory: flagquantum-mcp-server
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Unit tests
        working-directory: flagquantum-mcp-server
        run: pytest -m "not integration" --cov --cov-report=term-missing

      - name: Integration tests
        working-directory: flagquantum-mcp-server
        run: pytest -m integration

  package:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        working-directory: flagquantum-mcp-server
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --upgrade pip
          /tmp/wheelcheck/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/wheelcheck/bin/python -m pip install flagquantum-mcp-server/dist/*.whl
          /tmp/wheelcheck/bin/python -c "
          import flagquantum_mcp_server
          print('import ok', flagquantum_mcp_server.__version__)
          "
          /tmp/wheelcheck/bin/flagquantum-mcp-server --help >/dev/null 2>&1 || true
          test -x /tmp/wheelcheck/bin/flagquantum-mcp-server
