name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        working-directory: flagquantum-mcp-server
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default wheel on Linux x86_64 is the multi-GB
          # CUDA build and nothing here or in FlagQuantum needs it.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: ruff check
        working-directory: flagquantum-mcp-server
        run: ruff check .

      - name: ruff format --check
        working-directory: flagquantum-mcp-server
        run: ruff format --check .

      - name: mypy
        working-directory: flagquantum-mcp-server
        run: mypy --config-file ../mypy.ini src

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # FlagQuantum supports 3.10-3.12; 3.13 is excluded by its own
        # requires-python, so it is not tested here either.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        working-directory: flagquantum-mcp-server
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Unit tests
        working-directory: flagquantum-mcp-server
        run: pytest -m "not integration" --cov --cov-report=term-missing

      - name: Integration tests
        working-directory: flagquantum-mcp-server
        run: pytest -m integration

      - name: The documented example must still run
        # examples/stdio_client.py is what the README and examples/README.md
        # tell a newcomer to run, and it is the reference for how a host drives
        # this server. Nothing else executes it, so without this step it can rot
        # silently while every test stays green.
        working-directory: flagquantum-mcp-server
        run: python examples/stdio_client.py

  package:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        working-directory: flagquantum-mcp-server
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --upgrade pip
          /tmp/wheelcheck/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/wheelcheck/bin/python -m pip install flagquantum-mcp-server/dist/*.whl

      - name: The installed console script must complete an MCP handshake
        # The integration tests exercise an editable install from source. This
        # is the only check that the *built wheel* works, so it speaks the
        # protocol to the installed entry point rather than just importing it.
        run: |
          /tmp/wheelcheck/bin/python - <<'PY'
          import json, subprocess, sys

          proc = subprocess.Popen(
              ["/tmp/wheelcheck/bin/flagquantum-mcp-server"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )

          def send(message):
              proc.stdin.write(json.dumps(message) + "\n")
              proc.stdin.flush()

          def receive():
              return json.loads(proc.stdout.readline())

          send({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {
              "protocolVersion": "2025-06-18", "capabilities": {},
              "clientInfo": {"name": "ci", "version": "1"},
          }})
          info = receive()["result"]["serverInfo"]
          send({"jsonrpc": "2.0", "method": "notifications/initialized"})
          send({"jsonrpc": "2.0", "id": 2, "method": "tools/list"})
          tools = receive()["result"]["tools"]

          proc.stdin.close()
          proc.wait(timeout=30)

          assert info["name"] == "FlagQuantum", info
          # The surface is declared once, in tests/conftest.py, and read here
          # rather than counted again. It used to be a literal in three places,
          # so adding a tool left this one to go stale silently — which is
          # exactly what happened. This step still earns its place: it proves
          # the *built wheel* serves the same surface the source does.
          import sys; sys.path.insert(0, "flagquantum-mcp-server")
          from tests.conftest import EXPECTED_TOOLS
          served = {tool["name"] for tool in tools}
          assert served == set(EXPECTED_TOOLS), sorted(served ^ set(EXPECTED_TOOLS))
          assert proc.returncode == 0, proc.stderr.read()
          print(f"handshake ok: {info}, {len(tools)} tools")
          PY
