[mypy]
python_version = 3.10
strict = True
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
strict_equality = True
warn_unreachable = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
show_column_numbers = True
pretty = True
exclude = (?x)(
    /tests/
    | /examples/
    | /build/
    | /dist/
  )

# The MCP SDK and FlagQuantum ship complete type information, but pinning the
# import behaviour explicitly keeps mypy deterministic across versions.
[mypy-fastmcp.*]
ignore_missing_imports = True

[mypy-mcp.*]
ignore_missing_imports = True

[mypy-flagquantum.*]
ignore_missing_imports = True
